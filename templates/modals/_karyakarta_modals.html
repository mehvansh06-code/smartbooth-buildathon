<!-- MODAL: ADD / EDIT KARYAKARTA -->
  <div id="karyakartaModal" class="fixed inset-0 z-50 bg-slate-900/75 backdrop-blur-xs hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl border border-slate-200 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h3 class="text-sm font-black text-slate-900" id="karyakartaModalTitle">➕ नया कार्यकर्ता जोड़ें</h3>
        <button onclick="closeKaryakartaModal()" class="text-slate-400 hover:text-slate-600 font-bold text-sm cursor-pointer">✕</button>
      </div>
      <form onsubmit="event.preventDefault(); submitKaryakartaForm(event); return false;" class="space-y-3">
        <input type="hidden" id="modalKaryakartaId" value="">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">कार्यकर्ता का नाम (Full Name) *</label>
          <input type="text" id="modalKaryakartaName" required placeholder="e.g. रमेश शर्मा" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-xs font-bold text-slate-900 focus:outline-none focus:border-indigo-600">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">10-अंकीय मोबाइल नंबर (Mobile No. for Call & WhatsApp) *</label>
          <input type="tel" inputmode="numeric" maxlength="10" id="modalKaryakartaPhone" required placeholder="e.g. 9829012345" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-xs font-bold text-slate-900 focus:outline-none focus:border-indigo-600">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">
              {% if IS_WARD_ELECTION or CAMPAIGN.is_ward_election or CAMPAIGN.is_panchayat %}
                वार्ड / केंद्र (Ward/Booth)
              {% else %}
                मतदान केंद्र (Booth)
              {% endif %}
            </label>
            <select id="modalKaryakartaBooth" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-2 text-xs font-bold text-slate-900 focus:outline-none focus:border-indigo-600 truncate">
              <option value="0">समस्त केंद्र (General)</option>
              {% if IS_WARD_ELECTION or CAMPAIGN.is_ward_election or CAMPAIGN.is_panchayat %}
                {# LOCAL BODY ELECTION (Gram Panchayat, Nagar Palika, Zila Parishad) #}
                {% if WARDS and WARDS|length > 1 %}
                  <optgroup label="📍 वार्डवार (Ward-Wise)">
                    {% for w_no, w_info in WARDS.items() %}
                      <option value="ward:{{ w_no }}">
                        वार्ड {{ w_no }}
                      </option>
                    {% endfor %}
                  </optgroup>

                {% elif WARDS and WARDS|length == 1 %}
                  {% set single_ward_no = (WARDS.keys()|list)[0] %}
                  <optgroup label="📋 वार्ड {{ single_ward_no }} के भाग (भाग संख्या / Parts)">
                    {% for p_no, b_info in BOOTHS.items() %}
                      {% set b_name = (b_info.name or b_info.booth_name or ('भाग ' ~ p_no))|replace('\ufffd', '')|replace(' ं', '') %}
                      {% set clean_name = b_name %}
                      {% if b_info.booth_no and clean_name.startswith(b_info.booth_no|string ~ ' - ') %}
                        {% set clean_name = clean_name[((b_info.booth_no|string|length) + 3):] %}
                      {% elif clean_name.startswith(p_no|string ~ ' - ') %}
                        {% set clean_name = clean_name[((p_no|string|length) + 3):] %}
                      {% endif %}
                      <option value="part:{{ p_no }}">
                        भाग {{ p_no }}{% if b_info.booth_no and b_info.booth_no|string != p_no|string %} (बूथ {{ b_info.booth_no }}){% endif %} — {{ clean_name }}
                      </option>
                    {% endfor %}
                  </optgroup>

                {% else %}
                  {% for p_no, b_info in BOOTHS.items() %}
                    {% set b_name = (b_info.name or b_info.booth_name or ('भाग ' ~ p_no))|replace('\ufffd', '')|replace(' ं', '') %}
                    <option value="{{ p_no }}">
                      {{ b_name }}
                    </option>
                  {% endfor %}
                {% endif %}

              {% else %}
                {# STATE ASSEMBLY / VIDHAN SABHA (Strictly Booth-Wise) #}
                {% for p_no, b_info in BOOTHS.items() %}
                  {% set b_name = b_info.name or b_info.booth_name or ('भाग ' ~ p_no) %}
                  <option value="{{ p_no }}">
                    {% if b_info.booth_no and b_name.startswith(b_info.booth_no|string ~ ' - ') %}
                      भाग {{ p_no }} (बूथ {{ b_name }})
                    {% elif b_name.startswith(p_no ~ ' - ') %}
                      भाग {{ b_name }}
                    {% elif b_info.booth_no and b_info.booth_no|string != p_no|string %}
                      भाग {{ p_no }} (बूथ {{ b_info.booth_no }}) — {{ b_name }}
                    {% else %}
                      भाग {{ p_no }} — {{ b_name }}
                    {% endif %}
                  </option>
                {% endfor %}
              {% endif %}
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">क्षेत्र / पन्ना (Area)</label>
            <input type="text" id="modalKaryakartaArea" placeholder="e.g. जाटा बास" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-xs font-bold text-slate-900 focus:outline-none focus:border-indigo-600">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">अतिरिक्त विवरण / नोट्स (Notes)</label>
          <input type="text" id="modalKaryakartaNotes" placeholder="e.g. बूथ प्रभारी" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-xs font-bold text-slate-900 focus:outline-none focus:border-indigo-600">
        </div>
        <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
          <button type="button" onclick="closeKaryakartaModal()" class="px-3 py-2 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-lg cursor-pointer">रद्द करें</button>
          <button type="button" onclick="event.preventDefault(); submitKaryakartaForm(event);" id="modalKaryakartaSaveBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-black px-4 py-2 text-xs rounded-lg shadow-md cursor-pointer">सुरक्षित करें (Save)</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: ASSIGN SELECTED VOTERS TO KARYAKARTA -->
  <div id="assignKaryakartaModal" class="fixed inset-0 z-50 bg-slate-900/75 backdrop-blur-xs hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl border border-slate-200 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div>
          <h3 class="text-sm font-black text-slate-900">👥 मतदाता दायित्व सौंपें (Assign Voters)</h3>
          <p class="text-[11px] text-slate-500">चयनित <strong id="assignModalVoterCount" class="text-indigo-900">0</strong> मतदाताओं का दायित्व दें</p>
        </div>
        <button onclick="closeAssignKaryakartaModal()" class="text-slate-400 hover:text-slate-600 font-bold text-sm cursor-pointer">✕</button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">कार्यकर्ता चुनें (Select Karyakarta):</label>
          <select id="assignModalWorkerSelect" class="w-full bg-slate-50 border-2 border-indigo-300 rounded-lg px-3 py-2.5 text-xs font-bold text-slate-900 focus:outline-none focus:border-indigo-600">
            <option value="">-- कार्यकर्ता चुनें --</option>
          </select>
        </div>
        <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
          <button type="button" onclick="closeAssignKaryakartaModal()" class="px-3 py-2 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-lg cursor-pointer">रद्द करें</button>
          <button type="button" onclick="confirmAssignSelectedToWorker()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-black px-4 py-2 text-xs rounded-lg shadow-md cursor-pointer">दायित्व सौंपें (Assign)</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: VIEW KARYAKARTA ASSIGNED VOTERS & WHATSAPP DISPATCH -->
  <div id="karyakartaVotersDrawer" class="hidden fixed inset-0 z-50 bg-slate-900/75 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-3xl w-full max-h-[90vh] flex flex-col shadow-2xl border border-slate-200 overflow-hidden">
      <div class="p-4 border-b border-slate-200 bg-slate-900 text-white flex items-center justify-between flex-wrap gap-2">
        <div>
          <h3 class="text-sm font-black text-white flex items-center gap-2" id="kDrawerWorkerName">कार्यकर्ता मतदाता सूची</h3>
          <p class="text-[11px] text-slate-400" id="kDrawerWorkerMeta">आवंटित मतदाता दायित्व सूची</p>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="dispatchDrawerWorkerWhatsApp()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-black px-3.5 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 shadow-md cursor-pointer">
            <span>📲 Send Link via API</span>
          </button>
          <button onclick="closeKaryakartaDrawer()" class="text-slate-300 hover:text-white font-bold text-base px-2 cursor-pointer">✕</button>
        </div>
      </div>
      <div class="p-3 bg-emerald-50 border-b border-emerald-200 text-emerald-950 text-xs flex items-center justify-between font-bold" id="kDrawerStatsBar">
        <span>कुल मतदाता: 0</span>
        <span>वोट डाले: 0</span>
        <span>शेष: 0</span>
      </div>
      <div class="flex-1 overflow-y-auto p-4 space-y-2" id="kDrawerVotersList">
        <!-- Dynamically rendered assigned voters -->
      </div>
    </div>
  </div>

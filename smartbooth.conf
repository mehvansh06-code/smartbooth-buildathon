# STRICT RULE: DO NOT ADD smartbooth.in OR www.smartbooth.in HERE! (Controlled by sites-available/smartbooth.in)
# ==============================================================================
# SMARTBOOTH (स्मार्ट बूथ) PRODUCTION NGINX CONFIGURATION
# Domains: smartbooth.vedmap.com
# ==============================================================================

# ==============================================================================
# REDIRECT: digitalparchi domains & legacy domains -> canonical smartbooth.vedmap.com
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name digitalparchi.digitalpracharwala.com
                www.digitalparchi.digitalpracharwala.com
                digitalparchi.digitalparchiwala.com
                www.digitalparchi.digitalparchiwala.com
                digitalparchiwala.com
                www.digitalparchiwala.com
                chunaav360.vedmap.com
                chunaav360.vedma.com;

    # SSL Configuration (Cloudflare Full SSL Compatible)
    ssl_certificate /etc/nginx/ssl/eiofficial.crt;
    ssl_certificate_key /etc/nginx/ssl/eiofficial.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://smartbooth.vedmap.com$request_uri;
}

# HTTP Server (Direct Proxy for Cloudflare Flexible SSL & Local Traffic)
server {
    listen 80;
    listen [::]:80;
    server_name smartbooth.vedmap.com app.smartbooth.in;

    client_max_body_size 50M;

    # Static Assets Fast Serving & Caching
    location /static/ {
        alias /home/ubuntu/smartbooth/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # PWA Service Worker (Never Cache)
    location /sw.js {
        alias /home/ubuntu/smartbooth/static/sw.js;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # PWA Web Manifest
    location /manifest.json {
        alias /home/ubuntu/smartbooth/static/manifest.json;
        add_header Cache-Control "no-cache, max-age=3600" always;
        add_header Content-Type "application/manifest+json" always;
    }

    # Cloudflare Edge Caching for Voter Roll Bundles (0ms Morning Downloads)
    location ~ ^/api/voters/(campaign_bundle|bundle_version) {
        proxy_pass http://127.0.0.1:5030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Hide backend private headers to avoid duplicate header collision
        proxy_hide_header Cache-Control;
        proxy_hide_header CDN-Cache-Control;
        proxy_hide_header Cloudflare-CDN-Cache-Control;
        proxy_hide_header Surrogate-Control;

        # Allow Cloudflare Edge to cache for 15 minutes
        add_header Cache-Control "public, max-age=900, stale-while-revalidate=86400" always;
        add_header Cloudflare-CDN-Cache-Control "max-age=900" always;
    }

    # Reverse Proxy to SmartBooth Gunicorn WSGI
    location / {
        proxy_pass http://127.0.0.1:5030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;

        # Disable origin caching for live dynamic voter search and dispatch state
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        proxy_hide_header ETag;

        add_header Cache-Control "private, no-cache, no-store, must-revalidate, max-age=0, s-maxage=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header Surrogate-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header Expires "-1" always;
    }
}

# HTTPS Server (HTTP/2 + TLS for Direct/Cloudflare Full SSL)
server {
    listen 443 ssl http2;
